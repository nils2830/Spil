<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>spil. · silly smart games</title>
  <meta name="description" content="A collection of quick, ridiculously replayable browser games: guess the year, build timelines, dive for rare answers in Krillion and hunt the obvious in Noillirk.">
  <meta name="theme-color" content="#6b4dff">
  <meta property="og:title" content="spil. · silly smart games">
  <meta property="og:description" content="Guess the year, build timelines, dive for rare answers. Quick games that make you smarter by accident.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/home.css">
</head>
<body>
  <div id="topbar"></div>

  <main class="home">
    <header class="hero">
      <h1 class="hero-title"><span>s</span><span>p</span><span>i</span><span>l</span><span class="dot">.</span></h1>
      <p class="hero-sub">Silly little games that make you smarter by accident.</p>
      <div class="hero-actions">
        <button class="btn" id="surprise">🎲 Surprise me</button>
      </div>
    </header>

    <section class="dailies" aria-labelledby="dailies-h">
      <div class="section-head">
        <h2 id="dailies-h">Today's dailies</h2>
        <span class="muted" id="reset-clock"></span>
      </div>
      <div class="daily-row" id="daily-row"></div>
    </section>

    <section aria-labelledby="games-h">
      <div class="section-head">
        <h2 id="games-h">All games</h2>
        <div class="chips" id="filters" role="group" aria-label="Filter games"></div>
      </div>
      <div class="game-grid" id="game-grid"></div>
    </section>

    <section class="profile card" id="profile" aria-labelledby="profile-h">
      <div class="profile-top">
        <div class="avatar" id="avatar">🐟</div>
        <div class="profile-info">
          <div class="kicker">Your profile</div>
          <h2 id="profile-h"><span id="p-title">Fresh Fish</span> · <span id="p-level">Level 1</span></h2>
          <div class="p-bar"><span id="p-fill"></span></div>
          <div class="muted small" id="p-xp"></div>
        </div>
      </div>
      <div class="stat-row" id="p-stats"></div>
      <div class="best-list" id="p-bests"></div>
      <div class="center"><button class="btn ghost small" id="reset">Reset all progress</button></div>
    </section>

    <footer class="footer-note">
      Made for fun and curiosity. Progress is saved in your browser only.<br>
      Krillion and Noillirk are fan-made takes on the rare-answer and common-answer trivia formats.
    </footer>
  </main>

  <script src="assets/js/core.js"></script>
  <script src="assets/js/home.js"></script>
</body>
</html>
